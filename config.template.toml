[paths]
# Where meeting notes and audio are saved (Obsidian vault subfolder recommended)
output_dir = "~/Documents/MeetingRecordings"

[audio]
# How the other side of the meeting is captured.
#   "auto"      — use the macOS 14.2+ system audio tap, fall back to the loopback device
#   "tap"       — require the tap; fail rather than fall back
#   "blackhole" — always use the loopback device named in system_device
# The tap needs no audio setup and works whatever you are listening on,
# including Bluetooth. system_device only matters for the "blackhole" path.
capture_method = "auto"

# Run: python3 -c "import sounddevice; print(sounddevice.query_devices())" to list devices
system_device = "BlackHole 2ch"
mic_device = "MacBook Pro Microphone"

[whisper]
# Install: brew install whisper-cpp
# Download model: whisper-cpp --download-model large-v3  (or adjust path below)
model = "/opt/homebrew/Cellar/whisper-cpp/1.8.4/share/whisper-cpp/ggml-large-v3.bin"
binary = "/opt/homebrew/bin/whisper-cli"

[ollama]
# Install: brew install ollama && ollama pull llama3.1:8b
model = "llama3.1:8b"
host = "http://localhost:11434"
# Optional: override the built-in summarization prompt.
# Must contain {transcript} (where the transcript is inserted).
# May also contain {context} (the organizer context string). Unlike the built-in
# template which omits the context section entirely when no context is provided,
# a custom template that includes {context} will have it replaced with an empty
# string when absent — so wrap it in a conditional label only if you always supply
# context, or omit {context} from your template if you don't use that feature.
# Literal curly braces used as JSON examples are fine — they are handled safely.
# Example:
# prompt = """
# Summarize this meeting transcript in bullet points.
#
# {transcript}
# """

[llm]
# Which model writes the summary.
#   "ollama"    — local Ollama, using [ollama] model/host above (offline, the default)
#   "openai"    — any OpenAI-compatible Chat Completions API
#   "anthropic" — the Anthropic Messages API
# For "openai"/"anthropic", base_url is the API root including the version, e.g.
#   https://api.openai.com/v1, https://api.anthropic.com/v1, or a local gateway such
#   as http://localhost:6655/openai/v1.
# The API key is NOT stored here. Put it in the macOS Keychain once:
#   security add-generic-password -s MeetingRecorder -a llm-api-key -w
# (it prompts for the key), or set MEETING_RECORDER_LLM_KEY for scripts.
provider = "ollama"
base_url = ""
model = ""
# Names and terms the transcript often gets wrong — sent with every summary so the
# model spells them right. Comma-separated or one per line.
terms = ""
# If the hosted model cannot be reached (offline, off VPN), summarize with Ollama.
fallback_to_ollama = true
# Keep a tuned prompt outside this file (and outside any repo). It must contain
# {transcript} and may contain {context}; it outranks [ollama] prompt. A missing
# or invalid file falls back to the built-in prompt.
# prompt_file = "~/Documents/my-summary-prompt.txt"

# Optional: ground summaries in an Obsidian vault and log each note in the daily
# note. Off unless root is set. Nothing here is sent anywhere except to the
# summarizer you configured above.
# [vault]
# root = "~/Documents/MyVault"
# # Command run (from root) before each summary to refresh a status file. Use
# # absolute paths — the app does not inherit your shell's PATH. Failure is ignored.
# orient_command = "/usr/bin/python3 scripts/orient.py"
# status_file = "NOW.md"
# daily_notes_dir = "Daily Notes"        # files named YYYY-MM-DD.md
# daily_notes_to_read = 2                # most recent daily notes, up to the meeting date
# sections = ["Today", "Active Projects", "Waiting on / Blocked"]
# context_max_chars = 3000
# write_daily_note = false               # log the meeting under the daily note's notes section
# notes_section = "Notes Created"

[processing]
keep_audio = true
min_recording_seconds = 30
low_disk_threshold_mb = 500
# Mic RMS threshold (0–32767). Frames below this are silenced (suppresses speaker backwash).
# Raise if you still hear bleed; lower if your own voice is being cut off.
mic_threshold = 300
# Seconds between frames captured from imported video, so notes show what was on
# screen. The import dialogs are pre-filled with this and you can clear it per import.
# 0 turns frame capture off by default.
frames_every = 10
